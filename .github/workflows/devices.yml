# Приложение на разных iPhone и iPad: UI-тесты и скриншоты на трёх языках.
#
# Приложение требует iOS 26, поэтому «разные iOS» — это все версии 26.x,
# что есть на машине GitHub (самая новая и самая старая), а «разные
# телефоны» — от маленького SE до Pro Max и Air, плюс крупный шрифт
# универсального доступа: на нём и вылезают переносы вроде «Хорош/о».
# Скриншоты — в артефактах прогона (Actions → прогон → Artifacts).
name: Devices

on:
  push:
    paths:
      - "App/**"
      - "Core/Sources/**"
      - "project.yml"
      - ".github/workflows/devices.yml"
  workflow_dispatch:

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: ${{ matrix.device }} · iOS ${{ matrix.runtime }}${{ matrix.text && format(' · {0}', matrix.text) || '' }}
    # Обновления Dependabot меняют этот файл (версии actions) — 18 машин macOS
    # ради номера версии не нужны.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.runner || 'macos-26' }}
    # 60, а не 40: с уроками, темой и iPad тестов стало вдвое больше.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { device: "iPhone SE (3rd generation)", runtime: latest }
          - { device: "iPhone SE (3rd generation)", runtime: oldest }
          - { device: "iPhone 11", runtime: latest }
          - { device: "iPhone 13 mini", runtime: latest }
          - { device: "iPhone 14 Plus", runtime: latest }
          - { device: "iPhone 15", runtime: latest }
          - { device: "iPhone 15 Pro Max", runtime: latest }
          - { device: "iPhone 16e", runtime: latest }
          - { device: "iPhone 16 Pro", runtime: oldest }
          - { device: "iPhone 17", runtime: latest }
          - { device: "iPhone 17 Pro Max", runtime: latest }
          - { device: "iPhone Air", runtime: latest }
          - { device: "iPhone 17", runtime: latest, text: accessibility-extra-large }
          # iPad (P-70): от самого маленького до самого большого. Имя — начало
          # названия симулятора: у iPad в скобках меняется чип каждый год.
          - { device: "iPad mini", runtime: latest }
          - { device: "iPad Air 11", runtime: latest }
          - { device: "iPad Pro 13", runtime: latest }
          - { device: "iPad", runtime: oldest }
          # Складной iPhone Duo (осень 2026): симулятор — только в Xcode 27.1+
          # и с iOS 27.1, поэтому своя машина GitHub и своя версия iOS. На
          # открытом экране приложение получает regular-ширину, как iPad
          # (P-77). Нет симулятора на машине — строка пропускается с
          # предупреждением, а не падает.
          - { device: "iPhone Duo", runtime: latest, ios: "27", runner: xcode-27, xcode: "27" }
    steps:
      - uses: actions/checkout@v5
      - name: Xcode ${{ matrix.xcode || 'по умолчанию' }}
        if: matrix.xcode
        run: |
          # Самый новый Xcode нужной версии: у Duo симулятор с 27.1, а беты
          # лежат рядом с выпусками под разными именами.
          XCODE=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(xcode-select -p | sed 's|/Contents/Developer||'); fi
          echo "Xcode: $XCODE"; ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # Нет симулятора нужного устройства — докачать свежую iOS этой Xcode.
          if ! xcrun simctl list devicetypes | grep -q "${{ matrix.device }}"; then
            xcrun simctl list devicetypes | tail -20
          fi
          if ! xcrun simctl list runtimes | grep -q "iOS ${{ matrix.ios }}"; then
            xcodebuild -downloadPlatform iOS || true
          fi
          xcrun simctl list runtimes
      - name: XcodeGen
        run: |
          brew install xcodegen || true
          xcodegen generate
      - name: Симулятор
        id: sim
        run: |
          python3 - "${{ matrix.device }}" "${{ matrix.runtime }}" "${{ matrix.ios || '26' }}" > sim.env <<'PY'
          import json, subprocess, sys
          device, which, major = sys.argv[1], sys.argv[2], sys.argv[3]
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))["devicetypes"]
          runtimes = [r for r in json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
                      if r["platform"] == "iOS" and r["isAvailable"] and r["version"].split(".")[0] == major]
          runtimes.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          kind = next((t["identifier"] for t in types if t["name"] == device), "") or next(
              (t["identifier"] for t in types if t["name"].startswith(device + " ")), "")
          runtime = (runtimes[-1] if which == "latest" else runtimes[0]) if runtimes else None
          print(f"TYPE={kind}")
          print(f"RUNTIME={runtime['identifier'] if runtime else ''}")
          print(f"VERSION={runtime['version'] if runtime else ''}")
          PY
          cat sim.env
          source sim.env
          if [ -z "$TYPE" ] || [ -z "$RUNTIME" ]; then
            echo "::warning::Нет симулятора «${{ matrix.device }}» с iOS ${{ matrix.ios || '26' }} на этой машине — пропускаю"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UDID=$(xcrun simctl create "Recap test" "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          if [ -n "${{ matrix.text }}" ]; then
            xcrun simctl ui "$UDID" content_size "${{ matrix.text }}"
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: UI-тесты и скриншоты
        if: steps.sim.outputs.skip != 'true'
        run: |
          set +e
          xcodebuild test \
            -project AJFM.xcodeproj \
            -scheme AJFM \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:AJFMUITests \
            -resultBundlePath result.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > ui.log 2>&1
          STATUS=$?
          grep -E "error:|Test Case .* failed|Executed [0-9]+ test|\*\* (BUILD|TEST)" ui.log \
            | grep -v "CoreData:" | tail -150
          exit $STATUS
      - name: Достать скриншоты
        if: always() && steps.sim.outputs.skip != 'true'
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path result.xcresult --output-path shots || true
          ls shots | head -50
      - uses: actions/upload-artifact@v4
        if: always() && steps.sim.outputs.skip != 'true'
        with:
          name: screens-${{ matrix.device }}-${{ steps.sim.outputs.version }}${{ matrix.text && format('-{0}', matrix.text) || '' }}
          path: shots
          if-no-files-found: ignore
          retention-days: 14

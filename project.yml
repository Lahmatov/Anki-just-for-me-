name: AJFM
options:
  bundleIdPrefix: com.lahmatov
  # Исходный язык — русский; португальский и английский переводы лежат
  # в .lproj рядом с ресурсами, строки интерфейса — в коде (tr).
  developmentLanguage: ru
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

packages:
  AJFMCore:
    path: Core

targets:
  AJFM:
    type: application
    platform: iOS
    # Подпись живёт в отдельном xcconfig, чтобы перегенерация проекта её не стирала.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
      # Условия, политика и лицензии — те же файлы, что публикуются на сайте:
      # в приложении они читаются без сети и не расходятся с опубликованными.
      - path: docs/legal
        buildPhase: resources
    dependencies:
      - package: AJFMCore
        product: AJFMCore
      # Виджет на экран «Домой» встраивается в приложение.
      - target: AJFMWidget
    # Схема с тестами: иначе `xcodebuild test` (и ⌘U) не знает, что гонять.
    scheme:
      testTargets:
        - AJFMTests
        - AJFMUITests
      gatherCoverageData: true
    settings:
      base:
        # Bundle ID менять нельзя: на бесплатном аккаунте лимит ~10 новых App ID
        # за 7 дней, и каждый новый идентификатор его расходует.
        PRODUCT_BUNDLE_IDENTIFIER: com.lahmatov.ajfm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recap
        # Языки, которые iOS предложит в настройках приложения. Имя под иконкой
        # и тексты запросов разрешений переводятся через InfoPlist.strings.
        CFBundleLocalizations:
          - ru
          - pt-PT
          - en
        CFBundleDevelopmentRegion: ru
        # Статичный экран запуска в цвет первого экрана: по правилам Apple
        # запуск должен ощущаться мгновенным, а анимация идёт уже внутри
        # приложения — поверх загруженного содержимого, ничего не задерживая.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        # Только HTTPS системными средствами — освобождено от экспортного
        # контроля. Без ключа App Store Connect спрашивает об этом при каждой сборке.
        ITSAppUsesNonExemptEncryption: false
        # Адрес сервера Recap (backend/) после `wrangler deploy`. Пока стоит
        # заглушка, подписка и промокоды в приложении не показываются.
        RecapBackendURL: https://recap-backend.CHANGE-ME.workers.dev
        # Продавец — те же имя, адрес и почта, что в App Store Connect для DSA.
        # Подставляются в условия и политику в приложении и в письмо в поддержку.
        RecapSellerName: CHANGE-ME
        RecapSellerAddress: CHANGE-ME
        RecapContactEmail: CHANGE-ME
        # Вход через Apple включается в Config/Signing.xcconfig вместе со
        # способностью: на бесплатном аккаунте её нет, и кнопка была бы мёртвой.
        RecapSignInWithApple: $(RECAP_SIGN_IN_WITH_APPLE)
        # Группа приложений для виджета — тоже только на платном аккаунте
        # (Config/Signing.xcconfig). Пусто — виджет без цифр.
        RecapAppGroup: $(RECAP_APP_GROUP)
        # Шрифт интерфейса по умолчанию. Статические начертания, а не
        # вариативный файл: так каждое находится по имени (tools/make_fonts.py).
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - Rubik-Bold.ttf
        # Благодаря этому приложение появляется в шторке «Поделиться» для .json —
        # так набор долетает из Файлов, iCloud Drive или мессенджера.
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: >-
          Чтобы проверять произношение, приложению нужен доступ к микрофону.
          Запись остаётся на устройстве.
        NSSpeechRecognitionUsageDescription: >-
          Распознавание речи работает локально и нужно, чтобы сверить
          произнесённое слово с тем, которое ты учишь.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Набор карточек
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json

  # Виджет: сколько карточек ждёт, серия и Мончик. Читает снимок, который
  # приложение оставляет в группе приложений (WidgetBridge), базу не открывает.
  AJFMWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/WidgetSigning.xcconfig
      Release: Config/WidgetSigning.xcconfig
    sources:
      # Info.plist генерируется XcodeGen — в ресурсы его класть нельзя.
      - path: Widget
        excludes:
          - Info.plist
    dependencies:
      - package: AJFMCore
        product: AJFMCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        # Новый идентификатор расходует один App ID из лимита бесплатного аккаунта.
        PRODUCT_BUNDLE_IDENTIFIER: com.lahmatov.ajfm.widget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Recap
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        RecapAppGroup: $(RECAP_APP_GROUP)

  AJFMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: AJFM
      - package: AJFMCore
        product: AJFMCore
    settings:
      base:
        # Тестам нужен доступ к типам приложения через @testable import AJFM.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AJFM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AJFM"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.lahmatov.ajfm.tests
        GENERATE_INFOPLIST_FILE: YES

  # Дымовые UI-тесты: запуск на симуляторе и главный путь (App/UITests).
  AJFMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: AJFM
    settings:
      base:
        TEST_TARGET_NAME: AJFM
        PRODUCT_BUNDLE_IDENTIFIER: com.lahmatov.ajfm.uitests
        GENERATE_INFOPLIST_FILE: YES
